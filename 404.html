<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#03080f">
<title>Cal Flood | 404 Not Found</title>
<link rel="icon" type="image/png" href="/Faviconm.png">
<link rel="apple-touch-icon" href="/Faviconm.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800&family=Montserrat:wght@500;600&display=swap" rel="stylesheet">
<style>
  /* Lets the Home Page text colour animate smoothly (settle and hover) */
  @property --hp-base {
    syntax: '<color>';
    inherits: false;
    initial-value: #17D8DB;
  }

  :root {
    --cyan: #17D8DB;
    --cyan-glow: rgba(23, 216, 219, 0.6);
    --blue: #0077ff;
    --hp-rest: #4f93b8;     /* calm blue once the intro has settled */
    --hp-hover: #55f1f4;    /* brighter blue on hover */
  }

  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', sans-serif; }

  html, body { min-height: 100%; }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    color: #fff;
    background-color: #02060d;
    background-image:
      radial-gradient(110% 80% at 50% 20%, #08152a 0%, #050d1a 38%, #02060d 70%, #010307 100%);
    background-attachment: fixed;
    overflow-x: hidden;
  }

  /* ---------- Layout ---------- */
  .stage {
    flex: 1;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px 24px;
  }

  /* ---------- 404 heading ---------- */
  .code {
    font-family: 'Inter', sans-serif;
    font-weight: 800;
    font-size: clamp(1.7rem, 4.5vw, 2.7rem);
    letter-spacing: 2px;
    line-height: 1.1;
    color: #12b6b9;
  }

  .sub {
    margin-top: 14px;
    font-weight: 500;
    font-size: 1rem;
    letter-spacing: 0.3px;
    line-height: 1.5;
    color: rgba(150, 178, 205, 0.7);
  }

  /* ---------- Shield + glow ---------- */
  .shield-wrap {
    position: relative;
    margin-top: clamp(32px, 6vh, 64px);
    width: 110px;
    height: 110px;
    display: grid;
    place-items: center;
  }

  .shield-glow {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 240px;
    height: 240px;
    max-width: 100vw;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle at center,
      rgba(23, 216, 219, 0.16) 0%,
      rgba(0, 119, 255, 0.1) 40%,
      transparent 70%);
    filter: blur(24px);
    pointer-events: none;
    animation: glow 4.5s ease-in-out infinite;
  }

  @keyframes glow {
    0%, 100% { opacity: 0.55; }
    50%      { opacity: 1; }
  }

  .shield {
    position: relative;
    z-index: 1;
    width: 80px;
    height: 80px;
    color: rgba(23, 216, 219, 0.6);
    animation: shield 4.5s ease-in-out infinite;
  }

  @keyframes shield {
    0%, 100% { transform: scale(1);    filter: drop-shadow(0 0 4px rgba(23, 216, 219, 0.15)); }
    50%      { transform: scale(1.025); filter: drop-shadow(0 0 9px rgba(23, 216, 219, 0.3)); }
  }

  /* ---------- Return button ---------- */
  .home-btn {
    margin-top: clamp(40px, 8vh, 80px);
    display: inline-flex;
    align-items: baseline;
    gap: 0.4em;
    padding: 10px 6px;
    color: rgba(255, 255, 255, 0.85);
    font-weight: 600;
    font-size: 1.05rem;
    letter-spacing: 0.5px;
    text-decoration: none;
  }

  .home-btn:focus-visible { outline: 2px solid var(--cyan); outline-offset: 6px; border-radius: 4px; }

  /* "Home Page": blue base, with two highlight bands that travel outward from the centre */
  .hp {
    --hp-base: var(--hp-rest);
    position: relative;
    display: inline-block;
    font-weight: 600;
    background-image:
      linear-gradient(90deg, transparent, rgba(235, 255, 255, 0.95), transparent),
      linear-gradient(90deg, transparent, rgba(235, 255, 255, 0.95), transparent),
      linear-gradient(var(--hp-base), var(--hp-base));
    background-repeat: no-repeat;
    background-size: 0% 100%, 0% 100%, 100% 100%;
    background-position: 50% 0, 50% 0, 0 0;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
    transition: --hp-base 0.35s ease;
    animation: hpPulse 3.2s ease-in-out infinite;
  }

  @keyframes hpPulse {
    0%, 100% { --hp-base: var(--hp-rest); filter: drop-shadow(0 0 0 rgba(23, 216, 219, 0)); }
    50%      { --hp-base: #7cc6e6;        filter: drop-shadow(0 0 6px rgba(23, 216, 219, 0.3)); }
  }

  /* The line, drawn from the centre outwards */
  .hp::after {
    content: '';
    position: absolute;
    left: 0;
    right: 0;
    bottom: -5px;
    height: 2px;
    border-radius: 2px;
    background: var(--cyan);
    box-shadow: 0 0 10px rgba(23, 216, 219, 0.7);
    transform: scaleX(0);
    transform-origin: center;
    opacity: 0;
    pointer-events: none;
    transition: transform 0.5s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.3s ease;
  }

  /* Intro: on arrival the line draws in, the text shimmers, then both slowly fade away */
  .hp.intro {
    animation:
      hpShimmer 2.8s ease-in-out 0.8s 3,
      hpSettle 3s ease 8s both;
  }
  .hp.intro::after { animation: hpLine 10s ease 0.6s; }

  @keyframes hpShimmer {
    0%   { background-size: 0% 100%, 0% 100%, 100% 100%;   background-position: 50% 0, 50% 0, 0 0; }
    15%  { background-size: 34% 100%, 34% 100%, 100% 100%; background-position: 50% 0, 50% 0, 0 0; }
    70%  { background-size: 34% 100%, 34% 100%, 100% 100%; background-position: 0% 0, 100% 0, 0 0; }
    82%  { background-size: 0% 100%, 0% 100%, 100% 100%;   background-position: 0% 0, 100% 0, 0 0; }
    100% { background-size: 0% 100%, 0% 100%, 100% 100%;   background-position: 0% 0, 100% 0, 0 0; }
  }

  @keyframes hpSettle {
    from { --hp-base: #17D8DB; }
    to   { --hp-base: var(--hp-rest); }
  }

  @keyframes hpLine {
    0%   { transform: scaleX(0); opacity: 1; }
    10%  { transform: scaleX(1); opacity: 1; }
    62%  { transform: scaleX(1); opacity: 1; }
    97%  { transform: scaleX(1); opacity: 0; }
    100% { transform: scaleX(0); opacity: 0; }
  }

  /* Hover / keyboard focus: brighter blue, shimmer, line grows from the centre */
  .home-btn:hover .hp,
  .home-btn:focus-visible .hp {
    --hp-base: var(--hp-hover);
    animation: hpShimmer 2.4s ease-in-out infinite;
  }
  .home-btn:hover .hp::after,
  .home-btn:focus-visible .hp::after {
    transform: scaleX(1);
    opacity: 1;
  }

  /* ---------- Footer ---------- */
  .footer {
    width: 100%;
    padding: 0 24px 30px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    text-align: center;
  }

  .footer-logo {
    font-family: 'Inter', sans-serif;
    font-weight: 800;
    font-size: 1.15rem;
    letter-spacing: 4px;
    color: rgba(23, 216, 219, 0.5);
  }

  .footer-divider {
    width: 48px;
    height: 2px;
    border-radius: 2px;
    background: rgba(23, 216, 219, 0.3);
  }

  .footer-tech {
    font-weight: 500;
    font-size: 0.8rem;
    letter-spacing: 5px;
    color: rgba(23, 216, 219, 0.4);
  }

  /* ---------- Corner badge ---------- */
  .corner {
    position: fixed;
    right: 22px;
    bottom: 22px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 500;
    font-size: 0.75rem;
    letter-spacing: 0.5px;
    color: rgba(150, 195, 230, 0.65);
  }

  .corner-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--cyan);
    box-shadow: 0 0 8px var(--cyan);
    animation: blink 1.8s ease-in-out infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50%      { opacity: 0.2; }
  }

  /* ---------- Small screens ---------- */
  @media (max-width: 640px) {
    .shield-wrap { width: 96px; height: 96px; }
    .shield { width: 70px; height: 70px; }
    .home-btn { font-size: 1rem; }
    .corner { position: static; margin-bottom: 22px; }
    .footer-tech { letter-spacing: 3px; }
  }

  /* ---------- Reduced motion ---------- */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation: none !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>

  <main class="stage">
    <h1 class="code">404 - Not Found</h1>
    <p class="sub">This page doesn't exist or may have moved.</p>

    <div class="shield-wrap" aria-hidden="true">
      <div class="shield-glow"></div>
      <svg class="shield" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M50 5L15 18V45C15 67.5 30 88 50 95C70 88 85 67.5 85 45V18L50 5Z" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-width="6" stroke-linejoin="round"/>
        <rect x="38" y="48" width="24" height="18" rx="2" fill="currentColor"/>
        <path d="M43 48V42C43 38.134 46.134 35 50 35C53.866 35 57 38.134 57 42V48" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
      </svg>
    </div>

    <a class="home-btn" href="/">Return to the <span class="hp intro">Home Page</span></a>
  </main>

  <footer class="footer">
    <div class="footer-logo">CF 2026</div>
    <div class="footer-divider"></div>
    <div class="footer-tech">HTML | CSS | JS</div>
  </footer>

  <div class="corner">
    <span class="corner-dot" aria-hidden="true"></span>
    <span>Powered by Vercel</span>
  </div>

<script>
  // Ends the intro animation as soon as the visitor interacts (or after it finishes),
  // so it never replays after a hover.
  (function () {
    var btn = document.querySelector('.home-btn');
    var hp = document.querySelector('.hp');
    if (!btn || !hp) return;
    var endIntro = function () { hp.classList.remove('intro'); };
    btn.addEventListener('mouseenter', endIntro);
    btn.addEventListener('focus', endIntro);
    btn.addEventListener('touchstart', endIntro, { passive: true });
    setTimeout(endIntro, 12000);
  })();
</script>
</body>
</html>
